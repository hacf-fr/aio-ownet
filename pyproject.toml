[project]
name = "aio-ownet"
version = "0.0.5"
description = "Async OWFS (owserver) client"
authors = [{ name = "epenet" }, { name = "HACF", email = "contact@hacf.fr" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
readme = "README.md"
keywords = ["owfs", "owserver"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Home Automation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hacf-fr/aio-ownet"
Repository = "https://github.com/hacf-fr/aio-ownet"
Documentation = "https://aio-ownet.readthedocs.io"
Changelog = "https://github.com/hacf-fr/aio-ownet/releases"

[dependency-groups]
dev = [
    "codespell==2.4.3",
    "coverage[toml]==7.16.2",
    "pre-commit-hooks==6.0.0",
    "prek==0.5.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "ty==0.0.84",
    "yamllint==1.38.0",
    "zizmor==1.30.1",
]
# docs (Python >= 3.14)
docs = [
    "furo==2025.12.19; python_version >= '3.14'",
    "myst-parser==5.1.0; python_version >= '3.14'",
    "sphinx==9.1.0; python_version >= '3.14'",
    "sphinx-autobuild==2025.8.25; python_version >= '3.14'",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.codespell]
skip = "node_modules,package-lock.json,uv.lock"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["aio_ownet"]

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python-version = "3.11"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "A001",    # Variable is shadowing a Python builtin
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
]
select = [
    "A", #flake8-builtins
    "B", #flake8-bugbear
    "C4", #flake8-comprehensions
    "C90", #mccabe
    "E", #pycodestyle error
    "ERA", #eradicate
    "F", #Pyflakes
    "I", #isort
    "N", #pep8-naming
    "PL", #Pylint
    "PT", #flake8-pytest-style
    "UP", #pyupgrade
]

[tool.ruff.lint.isort]
force-single-line = true
known-local-folder = [
    "aio_ownet",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
