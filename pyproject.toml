[tool.poetry]
name = "aio-ownet"
version = "0.0.5"
description = "Async OWFS (owserver) client"
authors = ["epenet", "HACF <contact@hacf.fr>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/hacf-fr/aio-ownet"
repository = "https://github.com/hacf-fr/aio-ownet"
documentation = "https://aio-ownet.readthedocs.io"
keywords=["owfs", "owserver"]
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Home Automation",
]

[tool.poetry.urls]
Changelog = "https://github.com/hacf-fr/aio-ownet/releases"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[tool.poetry.group.dev.dependencies]
Pygments = "==2.21.0"
ruff = "==0.16.9"
coverage = {extras = ["toml"], version = "==7.16.2"}
darglint = "==1.8.1"
mypy = "2.3.1"
pre-commit = "==4.6.2"
pre-commit-hooks = "==6.0.0"
pytest = "==9.1.1"
pytest-asyncio = "==1.4.0"
pytest-cov = "==7.1.0"
safety = "==3.8.1"
typeguard = "==4.6.0"

# docs (Python >= 3.14)
furo = {version = "==2025.12.19", python = ">=3.14"}
myst-parser = {version = "==5.1.0", python = ">=3.14"}
sphinx = {version = "==9.1.0", python = ">=3.14"}
sphinx-autobuild = {version = "==2025.8.25", python = ">=3.14"}

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["aio_ownet"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "A001",    # Variable is shadowing a Python builtin
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
]
select = [
    "A", #flake8-builtins
    "B", #flake8-bugbear
    "C4", #flake8-comprehensions
    "C90", #mccabe
    "E", #pycodestyle error
    "ERA", #eradicate
    "F", #Pyflakes
    "I", #isort
    "N", #pep8-naming
    "PL", #Pylint
    "PT", #flake8-pytest-style
    "UP", #pyupgrade
]

[tool.ruff.lint.isort]
force-single-line = true
known-local-folder = [
    "aio_ownet",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
